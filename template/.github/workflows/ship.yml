# Ship when app.json changes (or by hand); grade the live view daily. Data never comes
# through here: publishers commit it to the app, and the Worker indexes it every 5 minutes.
name: ship
on:
  push: { branches: [main], paths: [app.json] }
  schedule: [{ cron: "17 13 * * *" }]
  workflow_dispatch:
concurrency: { group: ship, cancel-in-progress: false }
permissions: { contents: write }   # to commit .ship/state.json back
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETH_PRIVATE_KEY: ${{ secrets.ETH_PRIVATE_KEY }}
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
      PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: github.event_name != 'schedule'
        run: ci/ship.sh ship
      - if: github.event_name != 'schedule'
        name: keep the claim block, URL and agent id
        run: |
          git add .ship/state.json
          git diff --cached --quiet || { git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "ship: state" && git push; }
      - uses: actions/cache@v4
        with: { path: ~/.cache/fangorn-mcp/models, key: models-embeddinggemma }
      - run: ci/ship.sh eval
