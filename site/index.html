<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fangorn app</title>
<style>
  /* The fangorn base: structure and a few tokens, no paint. An app repaints by shipping its own
     theme.css (site.pages/theme.css), loaded after this; override the tokens first, rules if you must. */
  :root {
    --bg: #fbfbf8; --fg: #1a1c19; --muted: #6a6f68; --line: #dfe1db; --accent: #2f5d45;
    --mark: #e6eedb; --hot: #b4432f; --edge: #b7bab2;
    --font: system-ui, sans-serif; --font-display: var(--font); --radius: 3px; --gutter: 16px; --measure: 760px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121412; --fg: #e4e6e0; --muted: #959a92; --line: #2a2e29; --accent: #8fbf9f;
    --mark: #2d3b2a; --hot: #d9674f; --edge: #4b5049; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); margin: 0; }
  a { color: var(--accent); } button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; padding: 0; margin: 0; }
  h2 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 8px; }
  h2.page, .record h2 { font: 600 1.3rem/1.3 var(--font-display); text-transform: none; letter-spacing: 0; color: var(--fg); margin: 4px 0 12px; }
  h3 { margin: 0; font-size: 1rem; }
  small, time, .hint, .empty, .about, #status, .resultsbar, .detail { color: var(--muted); }
  small, time, .hint { font-size: .8rem; }
  .paid { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 12px 0; display: grid; gap: 6px; }
  .paid h3 { margin: 0; font-size: 1rem; } .paid ul { margin: 0; padding-left: 18px; } .detail { margin: 0; font-size: .9rem; }
  .forsale { color: var(--accent); font-weight: 600; }
  mark { background: var(--mark); color: inherit; }

  /* the bar: name, search, sections */
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar > div, main, footer { max-width: var(--measure); margin: 0 auto; padding-inline: var(--gutter); }
  .bar > div { padding-block: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #home { color: var(--fg); text-decoration: none; font: 600 1.1rem var(--font-display); white-space: nowrap; }
  #q { flex: 1 1 240px; }
  #q input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; }
  /* Where to go on the left; the reader's account and the app's own pages after a rule. */
  nav { display: flex; gap: 14px; font-size: .9rem; } nav > span { display: flex; gap: inherit; }
  #aside:not(:empty) { border-left: 1px solid var(--line); padding-left: 14px; }
  nav a { color: var(--muted); text-decoration: none; } nav a.on, nav a:hover { color: var(--fg); }
  main { padding-block: 16px 48px; }

  /* results: one rule between rows, votes on the right */
  .list, article { border-top: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
  .title { color: var(--fg); text-decoration: none; font-weight: 500; } .title:hover { color: var(--accent); }
  .resultsbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: .9rem; }
  .sort, .chips, .acts, .votes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips { margin: 4px 0 16px; }
  .picker { display: inline-flex; flex-direction: column; gap: 4px; margin: 4px 0 16px; font-size: .85rem; color: var(--muted); }
  .picker select { font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--edge); border-radius: var(--radius); padding: 6px 10px; min-width: min(320px, 100%); }
  details.about summary { cursor: pointer; color: var(--fg); font-size: 1.05rem; }
  details.about p { color: var(--muted); margin: 6px 0 0; }
  .chip { font-size: .85rem; padding: 2px 10px; }
  .chip.on, .vote[aria-pressed="true"] { border-color: var(--accent); background: var(--mark); }
  .vote { padding: 2px 7px; line-height: 1.3; }
  .star { font-size: 1.25rem; line-height: 1; padding: 4px 6px; border: 0; color: var(--muted); }
  .star[aria-pressed="true"] { color: var(--accent); background: none; }
  .more, .linkish { border: 0; color: var(--accent); padding: 8px 0 0; font-size: .9rem; }
  .act { font-size: .88rem; text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; }

  /* occasions on the front page, one record */
  article { padding: 12px 0 4px; } article header { display: flex; flex-direction: column; margin-bottom: 4px; }
  article .list { border-top: 0; } article .row:last-child { border-bottom: 0; }
  .record { border-top: 0; }
  .record dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: .88rem; margin: 12px 0; }
  .record dt { color: var(--muted); text-transform: capitalize; } .record dd { margin: 0; }
  .acts { margin: 12px 0 4px; }
  .signal { padding: 14px 0 6px; } .signal h3 { margin: 4px 0 6px; font: 600 1.15rem/1.3 var(--font-display); }
  .signal .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stage { color: var(--accent); font-weight: 700; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; } .steps li { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .steps time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .doc iframe { width: 100%; height: 80vh; border: 1px solid var(--line); margin-top: 12px; background: #fff; }

  /* For you: what the taste is built from, and the four knobs */
  .taste { margin-bottom: 20px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pills li { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 0 0 8px; font-size: .85rem; }
  .pills li.no { text-decoration: line-through; color: var(--muted); }
  .pills button { border: 0; padding: 0 8px; color: var(--muted); }
  .knobs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 12px 0; }
  .knob { display: grid; gap: 2px; font-size: .85rem; }
  .knob span { display: flex; justify-content: space-between; font-weight: 600; }
  .knob input { width: 100%; accent-color: var(--accent); }

  /* the map, for apps that ship map.json */
  body.wide { --measure: 1200px; }
  .mapbar input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; margin-bottom: 8px; }
  .mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .mapwrap { grid-template-columns: 1fr; } }
  svg.map { width: 100%; height: auto; display: block; position: sticky; top: 70px; }
  svg.map path { stroke: var(--edge); stroke-width: .8; cursor: pointer; }
  svg.map path:hover, svg.map path:focus { stroke: var(--accent); stroke-width: 2; outline: none; }
  svg.map path.near { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
  svg.map path.on { stroke: var(--fg); stroke-width: 2.6; }
  .h0 { fill: var(--bg); background: var(--bg); }
  .h1 { fill: color-mix(in srgb, var(--hot) 18%, var(--bg)); background: color-mix(in srgb, var(--hot) 18%, var(--bg)); }
  .h2 { fill: color-mix(in srgb, var(--hot) 36%, var(--bg)); background: color-mix(in srgb, var(--hot) 36%, var(--bg)); }
  .h3 { fill: color-mix(in srgb, var(--hot) 56%, var(--bg)); background: color-mix(in srgb, var(--hot) 56%, var(--bg)); }
  .h4 { fill: color-mix(in srgb, var(--hot) 78%, var(--bg)); background: color-mix(in srgb, var(--hot) 78%, var(--bg)); }
  .h5 { fill: var(--hot); background: var(--hot); }
  .sw { display: inline-block; width: 14px; height: 12px; border: 1px solid var(--edge); vertical-align: -1px; }
  .panel h3 { margin: 4px 0; } .panel .chips { margin: 6px 0; } .panel .list { margin-top: 8px; }

  footer { padding-block: 0 32px; color: var(--muted); font-size: .8rem; }
</style>
<link rel="stylesheet" href="./theme.css">
<header class="bar"><div>
  <a id="home" href="#/"><span id="name">Fangorn app</span></a>
  <form id="q" role="search"><input type="search" disabled placeholder="Loading…" aria-label="Search" list="recent" autocomplete="off"><datalist id="recent"></datalist></form>
  <nav><span id="primary"><a href="#/saved">Saved<span id="nsaved"></span></a></span><span id="aside"><a href="#/account" id="accountlink" hidden>Account</a></span></nav>
</div></header>
<main id="view"><p id="status">Loading the data…</p></main>
<footer>Search runs in your browser; your searches and saved records stay on this device unless you export them.
  Documents are the publishers' own, shown as they published them. Agents: <a href="./.well-known/agent-card.json">agent card</a>.</footer>
<script type="module" src="./main.js"></script>
</html>
