<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fangorn app</title>
<style>
  :root { --bg: #fbfaf7; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6a66; --accent: #2b5d8a; --line: #e4e1da; --chip: #efece5; --mark: #fdeaa8; --hot: #c0392b; --edge: #b9b5ab; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --card: #1c1c1a; --fg: #ecebe6; --muted: #9a988f; --accent: #7fb0dc; --line: #2c2b28; --chip: #262522; --mark: #5a4a12; --hot: #e0584c; --edge: #55534e; } }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar > div { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #home { color: var(--fg); text-decoration: none; font-weight: 700; font-size: 1.15rem; white-space: nowrap; }
  #q { flex: 1 1 260px; }
  #q input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; }
  nav { display: flex; gap: 14px; font-size: .92rem; }
  nav a { color: var(--muted); text-decoration: none; } nav a.on, nav a:hover { color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; }
  .about { color: var(--muted); margin: 4px 0 14px; }
  #status { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px; padding: 3px 11px; font-size: .86rem; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
  h2.page { font-size: 1.2rem; text-transform: none; letter-spacing: 0; color: var(--fg); }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  article header { display: flex; flex-direction: column; margin-bottom: 4px; }
  article time, small { color: var(--muted); font-size: .8rem; }
  h3 { margin: 0; font-size: 1.02rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
  article .row:first-child, .list .row:first-child { border-top: 0; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
  .title { color: var(--accent); text-decoration: none; } .title:hover { text-decoration: underline; }
  .detail { margin: 0; color: var(--muted); font-size: .9rem; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .star { background: none; border: 0; color: var(--muted); font-size: 1.15rem; line-height: 1; padding: 2px 4px; }
  .star.on { color: #d4a017; }
  .more, .linkish { background: none; border: 0; color: var(--accent); padding: 6px 0 0; font-size: .9rem; }
  .resultsbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; color: var(--muted); font-size: .9rem; }
  .sort { display: flex; gap: 6px; align-items: center; }
  .hint, .empty { color: var(--muted); font-size: .9rem; }
  .record h2 { font-size: 1.3rem; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 4px 0 10px; }
  .record dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: .88rem; margin: 12px 0; }
  .record dt { color: var(--muted); text-transform: capitalize; } .record dd { margin: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 4px; }
  .act { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 8px; padding: 5px 12px; font-size: .88rem; text-decoration: none; }
  .doc iframe { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; background: #fff; }
  body.wide main, body.wide .bar > div { max-width: 1200px; }
  .mapbar input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; margin-bottom: 8px; }
  .mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .mapwrap { grid-template-columns: 1fr; } }
  svg.map { width: 100%; height: auto; display: block; position: sticky; top: 70px; }
  svg.map path { stroke: var(--edge); stroke-width: .8; cursor: pointer; }
  svg.map path:hover, svg.map path:focus { stroke: var(--accent); stroke-width: 2; outline: none; }
  svg.map path.near { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
  svg.map path.on { stroke: var(--fg); stroke-width: 2.6; }
  .h0 { fill: var(--card); background: var(--card); } .h1 { fill: color-mix(in srgb, var(--hot) 18%, var(--card)); background: color-mix(in srgb, var(--hot) 18%, var(--card)); }
  .h2 { fill: color-mix(in srgb, var(--hot) 36%, var(--card)); background: color-mix(in srgb, var(--hot) 36%, var(--card)); }
  .h3 { fill: color-mix(in srgb, var(--hot) 56%, var(--card)); background: color-mix(in srgb, var(--hot) 56%, var(--card)); }
  .h4 { fill: color-mix(in srgb, var(--hot) 78%, var(--card)); background: color-mix(in srgb, var(--hot) 78%, var(--card)); }
  .h5 { fill: var(--hot); background: var(--hot); }
  .sw { display: inline-block; width: 14px; height: 12px; border: 1px solid var(--edge); vertical-align: -1px; }
  .panel h3 { margin: 4px 0; } .panel .chips { margin: 6px 0; align-items: center; } .panel .list { margin-top: 8px; }
  footer { max-width: 820px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--accent); }
</style>
<header class="bar"><div>
  <a id="home" href="#/"><span id="name">Fangorn app</span></a>
  <form id="q" role="search"><input type="search" disabled placeholder="Loading…" aria-label="Search"></form>
  <nav><a href="#/saved">Saved<span id="nsaved"></span></a><a href="#/history">History</a></nav>
</div></header>
<main id="view"><p id="status">Loading the data…</p></main>
<footer>Search runs in your browser; your searches and saved items stay on this device unless you export them.
  Documents are the publishers' own, shown as they published them. Agents: <a href="./.well-known/agent-card.json">agent card</a>.</footer>
<script type="module" src="./main.js"></script>
</html>
